name: Build Android APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK (signed with debug key)
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/boleta-columpio-kids.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boleta-columpio-kids-apk
          path: app/build/outputs/apk/release/boleta-columpio-kids.apk
          retention-days: 30

      - name: Create GitHub Release (on main/master only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Boleta Columpio Kids v1.0.${{ github.run_number }}"
          body: "APK generado automáticamente desde el commit ${{ github.sha }}"
          files: app/build/outputs/apk/release/boleta-columpio-kids.apk
          generate_release_notes: false
